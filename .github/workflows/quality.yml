name: QUANT NEXUS quality gates

on:
  push:
    branches: [main, "stabilize/**"]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("app/static/index.html").read_text(encoding="utf-8")
          if html.count("<script>") != 1 or html.count("</script>") != 1:
              raise SystemExit("Expected exactly one dashboard script block")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/quant-nexus-dashboard.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/quant-nexus-dashboard.js
          node --check app/static/monitoring-room.js
      - name: Run API regression tests
        env:
          PYTHONPATH: .
        run: pytest -q
